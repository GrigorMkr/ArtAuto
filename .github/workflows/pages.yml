name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub Pages (workflow mode)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            async function getPages() {
              try {
                const { data } = await github.request('GET /repos/{owner}/{repo}/pages', { owner, repo });
                return data;
              } catch (e) {
                if (e.status === 404) return null;
                throw e;
              }
            }

            let pages = await getPages();
            if (!pages) {
              console.log('Creating Pages with build_type=workflow');
              await github.request('POST /repos/{owner}/{repo}/pages', {
                owner,
                repo,
                build_type: 'workflow',
              });
            } else if (pages.build_type !== 'workflow') {
              console.log('Switching Pages to build_type=workflow (was', pages.build_type, ')');
              await github.request('PUT /repos/{owner}/{repo}/pages', {
                owner,
                repo,
                build_type: 'workflow',
                source: pages.source || { branch: 'main', path: '/' },
              });
            } else {
              console.log('Pages already in workflow mode:', pages.html_url, pages.status);
            }

            pages = await getPages();
            console.log('Final Pages:', JSON.stringify({
              url: pages?.html_url,
              status: pages?.status,
              build_type: pages?.build_type,
              source: pages?.source,
            }));

  build:
    needs: enable-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & build
        working-directory: web
        env:
          VITE_BASE: /ArtAuto/
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
