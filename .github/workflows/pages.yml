name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & build
        working-directory: web
        env:
          VITE_BASE: /ArtAuto/
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Enable / point Pages to gh-pages
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const source = { branch: 'gh-pages', path: '/' };

            async function getPages() {
              try {
                const { data } = await github.request('GET /repos/{owner}/{repo}/pages', { owner, repo });
                return data;
              } catch (e) {
                if (e.status === 404) return null;
                throw e;
              }
            }

            let pages = await getPages();
            if (!pages) {
              console.log('Creating Pages site…');
              await github.request('POST /repos/{owner}/{repo}/pages', {
                owner,
                repo,
                build_type: 'legacy',
                source,
              });
              pages = await getPages();
            } else {
              console.log('Pages exists, updating source to gh-pages…', pages.status, pages.html_url);
              try {
                await github.request('PUT /repos/{owner}/{repo}/pages', {
                  owner,
                  repo,
                  build_type: 'legacy',
                  source,
                });
              } catch (e) {
                // Some accounts only accept source update
                console.log('PUT with build_type failed:', e.status, e.message);
                await github.request('PUT /repos/{owner}/{repo}/pages', {
                  owner,
                  repo,
                  source,
                });
              }
            }

            const after = await getPages();
            console.log('Pages URL:', after?.html_url, 'status:', after?.status, 'source:', JSON.stringify(after?.source));
